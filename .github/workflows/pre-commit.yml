---
name: pre-commit

on: [push, pull_request]  # yamllint disable-line rule:truthy

permissions:
  contents: read

jobs:
  prek:
    name: Run prek hooks
    runs-on: ubuntu-latest
    container:
      image: docker.io/archlinux:base-devel

    steps:
      # git must be installed before checkout so it does a proper clone
      # (with .git directory) instead of a tarball download.
      - name: Install git
        run: pacman -Sy --noconfirm git

      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Restore prek cache
        uses: actions/cache@v6.1.0
        with:
          path: var/prek
          key: arch-prek-v1-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: pacman -S --noconfirm --needed just mise python

      - name: Run prek hooks
        run: |
          # The workspace is owned by the runner user, not the container's root.
          # A safe.directory entry isn't enough: some hooks (betterleaks) run git
          # with global/system config disabled. Take ownership instead.
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          just prek-run-on-all
